[package]
name = "lock-keys-protocol"
version = "0.1.0"
edition = "2021"
description = "The line protocol between lock-keys-daemon and the panel applets."

[features]
# Async client used by the applets.
client = ["dep:tokio"]

[dependencies]
tokio = { version = "1.48.0", features = ["net", "io-util", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
